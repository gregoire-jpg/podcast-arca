# Déploiement GitHub Pages — remplace l'hébergement Netlify.
# Se déclenche sur main (prod) et sur la branche de migration (validation).
# Le RSS est généré au build (comme le faisait Netlify avec build-rss.js).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, migrate/netlify-to-supabase]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer le flux RSS
        run: node build-rss.js
      - name: Assembler le site (sans les sources)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' --exclude='.git' --exclude='.github' \
            --exclude='node_modules' --exclude='netlify' --exclude='.netlify' \
            --exclude='supabase' --exclude='scripts' --exclude='*.md' \
            --exclude='package*.json' --exclude='build-rss.js' \
            --exclude='netlify.toml' --exclude='_headers' --exclude='.claude' \
            ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
